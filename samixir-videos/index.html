              tl.fromTo(root + ".cta-sub", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, t + 0.3);
              tl.fromTo(root + ".pill", { y: 40, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, t + 0.45);
              tl.fromTo(root + ".pill", { scale: 1 }, { scale: 1.05, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, t + 1.0);
            } else {
              tl.fromTo(root + ".l1", { y: 44, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, t);
              tl.fromTo(root + ".band", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, t + 0.15);
              tl.fromTo(root + ".l2", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, t + 0.3);
              if (d.icon) {
                tl.fromTo(root + ".benefit .icon", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.8)" }, t + 0.5);
                tl.fromTo(root + ".benefit .text", { x: -36, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "power2.out" }, t + 0.6);
              }
              tl.fromTo(root + ".pill", { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, t + (d.icon ? 0.75 : 0.55));
              // exit; the final scene holds to the end
              if (i < SCENES.length - 1) {
                tl.fromTo(root + ".scene-inner", { opacity: 1, y: 0 }, { opacity: 0, y: -26, duration: 0.35, ease: "power2.in", immediateRender: false }, s.t1 - 0.35);
              }
            }

            // effects
            const fx = d.fx;
            const fIn = s.t0 + 0.55,
              fOut = s.t1 - 0.4;
            if (fx && fx.type === "night") {
              tl.fromTo("#fx-night", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, s.t0 + 0.1);
              tl.fromTo("#fx-night .star", { opacity: 0.25 }, { opacity: 1, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 7, stagger: { each: 0.05 }, immediateRender: false }, s.t0 + 0.5);
              tl.to("#fx-night", { opacity: 0, duration: 0.45, ease: "power2.in" }, fOut);
            }
            if (fx && fx.type === "cool") {
              tl.fromTo("#fx-cool", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, s.t0 + 0.3);
              tl.fromTo("#fx-cool .glow", { scale: 0.7 }, { scale: 1.1, duration: s.t1 - s.t0, ease: "sine.inOut" }, s.t0);
              tl.fromTo("#fx-cool .flake", { y: -30, rotation: 0 }, { y: 80, rotation: 120, duration: s.t1 - s.t0, ease: "none", stagger: 0.08 }, s.t0);
              tl.to("#fx-cool", { opacity: 0, duration: 0.45, ease: "power2.in" }, fOut);
            }
            (fxNodes[i] || []).forEach((n, k) => {
              if (n.kind === "card") {
                tl.fromTo(n.el, { x: 140, opacity: 0, rotation: n.rot + 8 }, { x: 0, opacity: 1, rotation: n.rot, duration: 0.7, ease: "power3.out" }, fIn - 0.15);
                tl.to(n.el, { opacity: 0, x: 40, duration: 0.3, ease: "power2.in" }, fOut);
              } else if (n.kind === "pop") {
                tl.fromTo(n.el, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2)" }, fIn + k * 0.14);
                tl.to(n.el, { opacity: 0, scale: 0.85, duration: 0.3, ease: "power2.in" }, fOut);
              } else if (n.kind === "pulse") {
                tl.fromTo(n.el, { scale: 1, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: "power2.out", repeat: 2, immediateRender: false }, fIn + 0.3);
              } else if (n.kind === "spark") {
                tl.fromTo(n.el, { scale: 0, rotation: -45, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.45, ease: "back.out(2.2)" }, fIn + k * 0.18);
                tl.fromTo(n.el, { scale: 1 }, { scale: 0.75, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, fIn + 0.5 + k * 0.18);
                tl.to(n.el, { opacity: 0, duration: 0.3, ease: "power2.in" }, fOut);
              } else if (n.kind === "spin") {
                tl.fromTo(n.el, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, fIn);
                tl.fromTo(n.el.querySelector(".orbit-svg"), { rotation: 0 }, { rotation: n.slow ? 300 : 540, duration: s.t1 - fIn, ease: "none" }, fIn);
                tl.to(n.el, { opacity: 0, duration: 0.3, ease: "power2.in" }, fOut);
              } else if (n.kind === "steam") {
                tl.fromTo(
                  n.el,
                  { y: 40, opacity: 0, scaleX: 1 },
                  { keyframes: [{ y: 0, opacity: 0.85, duration: 0.6 }, { y: -50, opacity: 0, scaleX: 1.3, duration: 0.7 }], ease: "sine.inOut", repeat: 2, immediateRender: false },
                  fIn - 0.2 + n.k * 0.35
                );
              }
            });
          });

          // CTA: product steps back but stays the hero
          tl.fromTo("#orbit", { opacity: 1 }, { opacity: 0.5, duration: 0.5, immediateRender: false }, 18);

          window.__timelines["main"] = tl;
          if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
        }

        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(build);
        } else {
          build();
        }
      })();
    </script>
  </body>
</html>
